name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14t (free-threaded)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
          allow-prereleases: true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build turbonet extension
        run: python zig/build_turbonet.py --install

      - name: Install package and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio requests websockets

      - name: Run turboapi-core unit tests
        run: cd turboapi-core && zig build test

      - name: Run Zig unit tests
        run: |
          PY_INCLUDE=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
          PY_LIBDIR=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          cd zig
          zig build test \
            -Dpython=3.14t \
            -Dpy-include="$PY_INCLUDE" \
            -Dpy-libdir="$PY_LIBDIR"

      - name: Run WebSocket E2E tests
        run: python -m pytest tests/test_websocket_e2e.py -v --tb=short

      - name: Run remaining Python tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_websocket_e2e.py

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Bump version
        id: bump
        run: |
          pip install bump2version

          CURRENT=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "Current: $CURRENT"

          # bump2version config
          cat > .bumpversion.cfg << EOF
          [bumpversion]
          current_version = $CURRENT
          commit = False
          tag = False

          [bumpversion:file:pyproject.toml]
          search = version = "{current_version}"
          replace = version = "{new_version}"

          [bumpversion:file:python/setup.py]
          search = version="{current_version}"
          replace = version="{new_version}"

          [bumpversion:file:python/turboapi/__init__.py]
          search = __version__ = "{current_version}"
          replace = __version__ = "{new_version}"
          EOF

          bump2version "${{ github.event.inputs.version_bump }}" --allow-dirty

          NEW=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "New: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add pyproject.toml python/setup.py python/turboapi/__init__.py .bumpversion.cfg
          git commit -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push && git push --tags
